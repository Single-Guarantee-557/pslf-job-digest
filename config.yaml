# ---- What to search for --------------------------------------------------
# search_terms are sent to USAJOBS and Adzuna. Keep this list short:
# Adzuna's free tier is about 1,000 calls a month, and each term uses
# one call per location per day (plus one more if include_remote is on).
search_terms:
  - population health
  - public health
  - health data analyst
  - research scientist
  - nurse educator
  - clinical informatics
  - quality improvement
  - perioperative

# A job is kept only if its TITLE contains at least one of these (any case).
# This list can be long; it costs no API calls.
title_keywords:
  - population health
  - public health
  - analyst
  - epidemiolog
  - informatic
  - research scientist
  - evaluation
  - quality
  - health equity
  - nurse educator
  - nursing education
  - perioperative
  - data scien

exclude_title_words: [intern, internship, physician, psychiatrist, dentist, pharmacist, attorney, "medical director", "nurse practitioner"]
exclude_employers: []

# ---- Where and how much --------------------------------------------------
locations: ["New York, NY"]
radius_miles: 25
include_remote: true      # extra remote searches on USAJOBS and Adzuna
min_salary: 70000         # annual; hourly postings are not filtered
lookback_days: 3          # how far back each run looks; repeats are filtered out

# ---- PSLF employer checks ------------------------------------------------
nonprofit_state: NY       # state used when matching employers to IRS 501(c)(3) records
max_employer_lookups: 40  # new ProPublica lookups per run (results are cached)
show_unverified: false    # true = also list jobs whose employer could not be verified

# Fix any employer the automatic check gets wrong.
# Values: government, nonprofit, check, unknown
employer_overrides:
  "NYC Health + Hospitals": government
  "Mount Sinai": nonprofit
  "NYU Langone Health": nonprofit
  "NewYork-Presbyterian": nonprofit

# ---- Digest --------------------------------------------------------------
page_days: 14             # days of results kept on the landing page
send_empty_digest: false  # true = email even on days with nothing new
