# Every job must pass three filters, in this order.

# ---- 1. REMOTE (mandatory) -----------------------------------------------
# The posting must clearly say remote (or work from home / anywhere in the U.S.)
# and must not say hybrid. Location and salary are ignored.

# ---- 2. EMPLOYER (mandatory) ---------------------------------------------
# Government employers always pass. Other employers pass only if their name
# matches an IRS 501(c)(3) record.
# Set to true to also see "worth checking" jobs, where the employer is probably
# public or nonprofit but the name match isn't certain (common for hospital systems).
include_worth_checking: false
max_employer_lookups: 60   # new IRS lookups per run; results are cached

# Fix any employer the automatic check gets wrong. Values: government, nonprofit, unknown
employer_overrides:
  "NYC Health + Hospitals": government
  "Mount Sinai": nonprofit
  "NYU Langone Health": nonprofit
  "NewYork-Presbyterian": nonprofit

# ---- 3. KEYWORDS ---------------------------------------------------------
# The title or description must contain at least one. Matching uses word
# beginnings, so "analyst" also finds "analysts", but "nurse" does not find
# "nursing" (listed separately). Jobs with more matches are listed first.
keywords: [health, clinical, population, analyst, nurse, nursing, equity, perioperative, data]

# Optional: drop jobs whose title or employer contains any of these.
exclude_title_words: [chief, director, senior]
exclude_employers: []

# ---- Sources ---------------------------------------------------------------
sources:
  usajobs: true
  adzuna: true
  thejobsapi: true
  nyc: true   # NYC agency jobs are almost never fully remote; turn on to check anyway
lookback_days: 3     # how far back each run looks; repeats are filtered out
adzuna_pages: 10     # 50 results per page; 10 pages a day stays within the free tier

# The Jobs API bills by jobs returned and requests made. The free trial allows
# 500 jobs and 50 requests per week, so these defaults stay under it.
thejobsapi_max_jobs: 70       # jobs fetched per run
thejobsapi_max_requests: 5    # requests per run
thejobsapi_window: 24h        # 1h, 24h, 7d, 30d or 6m; 24h suits a daily run

# ---- Digest --------------------------------------------------------------
page_days: 14              # days of results kept on the landing page
send_empty_digest: false   # true = email even on days with nothing new
