name: Daily job digest

on:
  schedule:
    - cron: "0 11 * * *"   # 11:00 UTC = 6 or 7 AM in New York, depending on daylight saving
  workflow_dispatch:        # adds a "Run workflow" button for manual runs

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Build digest
        run: python job_digest.py
        env:
          USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
          USAJOBS_EMAIL: ${{ secrets.USAJOBS_EMAIL }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          NYC_APP_TOKEN: ${{ secrets.NYC_APP_TOKEN }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          JOBSAPI_KEY: ${{ secrets.JOBSAPI_KEY }}
      - name: Save results and landing page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add state docs
          git diff --cached --quiet || git commit -m "Digest $(date -u +%F)"
          git push
